<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DocWallet">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>DocWallet</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#111;color:#eee}
.hidden{display:none!important}
.card,main{max-width:480px;margin:0 auto;padding:16px}
input[type=password]{width:100%;padding:12px;margin:6px 0;font-size:16px;border-radius:10px;border:1px solid #333;background:#1c1c1c;color:#eee}
button,.btn{display:inline-block;padding:12px 16px;margin:6px 4px 6px 0;border:0;border-radius:10px;background:#3a7bd5;color:#fff;font-size:16px;cursor:pointer}
button.danger{background:#b3261e}
.secondary{background:#444}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
ul{list-style:none;padding:0}
li{display:flex;gap:8px;align-items:center;margin:6px 0}
li button:first-child{flex:1;text-align:left;background:#222;word-break:break-all}
header{display:flex;justify-content:space-between;align-items:center}
.err{color:#ff8a80;min-height:1.2em}
#viewer{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#viewer>button{align-self:flex-end;margin:8px}
#viewBody{flex:1;overflow:auto}
#viewBody img{max-width:100%}
#viewBody iframe{width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
<section id="auth" class="card hidden">
  <h1>DocWallet</h1>
  <p id="authHint"></p>
  <input id="pass" type="password" placeholder="Parola" autocomplete="current-password">
  <input id="pass2" type="password" placeholder="Confirma parola" autocomplete="new-password" class="hidden">
  <button id="authBtn">Deschide</button>
  <label class="btn secondary">Restaureaza din backup<input id="restore" type="file" class="sr"></label>
  <p id="authErr" class="err"></p>
</section>
<main id="app" class="hidden">
  <header><h1>DocWallet</h1><button id="lockBtn" class="secondary">Blocheaza</button></header>
  <label class="btn">Adauga fisiere<input id="upload" type="file" multiple class="sr"></label>
  <button id="backupBtn">Backup criptat</button>
  <ul id="list"></ul>
  <p id="status"></p>
</main>
<div id="viewer" class="hidden">
  <button id="closeViewer">Inchide</button>
  <div id="viewBody"></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
